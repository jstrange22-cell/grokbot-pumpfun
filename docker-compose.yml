# ATLAS dry-run on Hostinger Docker Manager (TradeWorks VPS).
# Health is on host 18080 because 8080 is already taken on this box.
# Stop new buys: touch state/KILL   Resume: rm state/KILL
# Promote to live is a human step, not a compose default.

services:
  grokbot:
    build: .
    image: grokbot-pumpfun:latest
    container_name: grokbot-pumpfun
    restart: unless-stopped
    stop_grace_period: 45s
    command: ["run", "--config", "/app/config.atlas.yaml"]
    environment:
      GROKBOT_MODE: "${GROKBOT_MODE:-dry-run}"
      GROKBOT_GROK_API_KEY: "${GROKBOT_GROK_API_KEY:-}"
      GROKBOT_DATA_API_KEY: "${GROKBOT_DATA_API_KEY:-}"
      GROKBOT_WALLET_PRIVATE_KEY: "${GROKBOT_WALLET_PRIVATE_KEY:-}"
      GROKBOT_LOG_LEVEL: "${GROKBOT_LOG_LEVEL:-INFO}"
      GROKBOT_HEALTH_PORT: "8080"
      GROKBOT_KILL_FILE: "${GROKBOT_KILL_FILE:-/app/state/KILL}"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - grokbot_logs:/app/logs
      - grokbot_state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  grokbot_logs:
  grokbot_state:
