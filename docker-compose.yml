# ATLAS dry-run on Hostinger Docker Manager (TradeWorks VPS).
# Health is on host 18080 because 8080 is already taken on this box.
# Grok key lives in /opt/grokbot/secrets.env on the VPS so Hostinger
# Compose-from-URL cannot overwrite it with .env.example dummies.
# Stop new buys: touch /opt/grokbot/KILL   Resume: rm that file
# Promote to live is a human step, not a compose default.

services:
  grokbot:
    build: .
    image: grokbot-pumpfun:latest
    container_name: grokbot-pumpfun
    restart: unless-stopped
    stop_grace_period: 45s
    command: ["run", "--config", "/app/config.atlas.yaml"]
    env_file:
      - /opt/grokbot/secrets.env
    environment:
      GROKBOT_MODE: "dry-run"
      GROKBOT_LOG_LEVEL: "INFO"
      GROKBOT_HEALTH_PORT: "8080"
      GROKBOT_KILL_FILE: "/app/state/KILL"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - grokbot_logs:/app/logs
      - grokbot_state:/app/state
      - /opt/grokbot/secrets.env:/opt/grokbot/secrets.env:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  grokbot_logs:
  grokbot_state:
