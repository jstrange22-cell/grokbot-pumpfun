# ATLAS dry-run:
#   cp .env.example .env && $EDITOR .env
#   mkdir -p config logs state && cp config.atlas.yaml config/config.yaml
#   docker compose up -d && docker compose logs -f
# Stop new buys without restart:  touch state/KILL
# Resume buys:                   rm state/KILL
# Promote to live is a human step, not a compose default.

services:
  grokbot:
    build: .
    image: grokbot-pumpfun:latest
    container_name: grokbot-pumpfun
    restart: unless-stopped
    stop_grace_period: 45s        # больше, чем ops.shutdown_grace_seconds
    environment:
      GROKBOT_MODE: "${GROKBOT_MODE:-dry-run}"
      GROKBOT_GROK_API_KEY: "${GROKBOT_GROK_API_KEY:?нужен ключ Grok}"
      GROKBOT_DATA_API_KEY: "${GROKBOT_DATA_API_KEY:-}"
      GROKBOT_WALLET_PRIVATE_KEY: "${GROKBOT_WALLET_PRIVATE_KEY:-}"
      GROKBOT_LOG_LEVEL: "${GROKBOT_LOG_LEVEL:-INFO}"
      GROKBOT_HEALTH_PORT: "8080"
      GROKBOT_KILL_FILE: "${GROKBOT_KILL_FILE:-/app/state/KILL}"
    ports:
      - "127.0.0.1:8080:8080"     # наружу health не выставляем
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
